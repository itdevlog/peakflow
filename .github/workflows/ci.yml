name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (pyflakes)
        run: python -m pyflakes bot.py database.py config.py report.py report_pdf.py web/*.py

      - name: Compile check
        run: python -m compileall -q bot.py database.py config.py report.py report_pdf.py web

      - name: Run tests
        env:
          DB_PATH: test_peakflow.db
        run: python -m pytest test/ -q
